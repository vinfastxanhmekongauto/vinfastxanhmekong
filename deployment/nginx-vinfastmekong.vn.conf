# ==============================================================================
# Nginx Configuration for vinfastmekong.vn & www.vinfastmekong.vn
# Proxies traffic to isolated Docker container vinfastmekong-web (127.0.0.1:3000)
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name vinfastmekong.vn www.vinfastmekong.vn;

    server_tokens off;

    # Allow Let's Encrypt Certbot challenge validation
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Proxy all HTTP requests to Next.js container
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Enable streaming support for Next.js App Router
        proxy_buffering off;
    }
}

